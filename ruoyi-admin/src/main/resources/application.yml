# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # tomcat 配置
  tomcat:
    # HTTP post内容的最大大小
    max-http-form-post-size: 1GB
    threads:
      # 最大工作线程数
      max: 256
      # 最小工作线程数
      min-spare: 10
    # 连接超时时间
    connection-timeout: 60000

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.dromara: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn

  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: RuoYi-Vue-Plus
  # Spring Boot Admin 配置 (随性能监控开关启停)
  boot:
    admin:
      # 监控面板上下文路径 (避免与业务接口路径冲突)
      context-path: /monitor
      client:
        enabled: ${performance-monitor.enabled}
        url: http://127.0.0.1:${server.port}
        # 服务端 API 前缀随 context-path 变化 客户端注册需对齐 (默认 instances)
        api-path: /monitor/instances
        username: ${performance-monitor.username}
        password: ${performance-monitor.password}
        instance:
          # 注册实例优先使用IP地址 (SBA 4.x 中 prefer-ip 已迁移为 service-host-type)
          service-host-type: ip
          # 服务端轮询本实例监控端点使用的凭证 (Basic 认证)
          metadata:
            user.name: ${performance-monitor.username}
            user.password: ${performance-monitor.password}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  main:
    # 延迟初始化（提高启动速度）
    lazy-initialization: false
    # 允许 Bean 定义覆盖（Spring Boot 4 默认禁止）
    allow-bean-definition-overriding: true
  datasource:
    # 延迟数据库连接获取（Spring Boot 4.1 新特性，提高启动速度）
    connection-fetch: lazy
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: true
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Security配置
security:
  jwt:
    # jwt秘钥 (至少256位 / 32字符 for HS256)
    secret-key: abcdefghijklmnopqrstuvwxyz0123456789
    # token有效期(分钟) 7天
    expiration: 10080
    # token前缀
    token-prefix: "Bearer"
    # token header名称
    header-name: Authorization
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    - /warm-flow-ui/config
    - /auth/**
    - /resource/sms/code
    - /resource/email/code
    - /auth/code
    - /

# 多租户配置
tenant:
  # 是否开启
  enable: true
  # 排除表
  excludes:
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - flow_spel

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: org.dromara.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.dromara.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥 
  publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKoR8mX0rGKLqzcWmOzbfj64K8ZIgOdHnzkXSOVOZbFu/TJhZ7rFAN+eaGkl3C4buccQd/EjEsj9ir7ijT7h96MCAwEAAQ==
  privateKey: 

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  swagger-ui:
    # 是否开启 swagger-ui 页面
    enabled: true
    # 默认展开 api 分组(可选: list | full | none)
    doc-expansion: none
  info:
    # 标题
    title: '标题：RuoYi-Vue-Plus多租户管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Lion Li
      email: crazylionli@163.com
      url: https://gitee.com/dromara/RuoYi-Vue-Plus
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: org.dromara.demo
    - group: 2.通用模块
      packages-to-scan: org.dromara.web
    - group: 3.系统模块
      packages-to-scan: org.dromara.system
    - group: 4.代码生成模块
      packages-to-scan: org.dromara.generator
    - group: 5.工作流模块
      packages-to-scan: org.dromara.workflow

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice
    - /warm-flow/save-json
    - /ai/**
    - /monitor/login
    - /monitor/logout
    - /monitor/instances

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # 性能监控配置 (Spring Boot Admin)
performance-monitor:
  # 总开关: true 启动性能监控平台 false 不启动
  enabled: true
  # 监控平台登录用户名
  username: admin
  # 监控平台登录密码
  password: tomori

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      # 端点基路径挂到监控上下文下 由监控安全链 Basic 认证保护 (避免被业务 JWT 链拦截)
      base-path: /monitor/actuator
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # AI 智能对话配置 (Spring AI 2.0.1)
# 总开关: false 时不加载任何 AI 功能 不影响项目正常启动; true 时加载全部 AI 能力
ai:
  enabled: true
  # AI 专用 PostgreSQL 数据源 (会话记忆 + pgvector 向量库 手动配置)
  datasource:
    url: jdbc:postgresql://192.168.150.10:5432/ruoyi_vue
    username: postgres
    password: tomori
  chat:
    # 会话记忆窗口大小(条数)
    max-messages: 30
  vector:
    # 向量表名
    table-name: ai_vector_store
    # 向量维度 需与 embedding 模型输出维度一致 (text-embedding-3-small 为 1536)
    dimensions: 1536
    # 知识库相似度检索 topK
    top-k: 4
    # 是否自动初始化向量表结构(需要数据库账号具备创建扩展权限)
    initialize-schema: true

--- # Spring AI OpenAI 配置 (仅 ai.enabled 为 true 时生效)
spring.ai:
  # 防御性配置: 会话记忆与向量库均由本系统手动配置 关闭其自动初始化避免误操作业务主库
  chat:
    memory:
      repository:
        jdbc:
          initialize-schema: embedded
  vectorstore:
    pgvector:
      initialize-schema: false
  openai:
    # OpenAI 兼容接口地址 (可替换为任意兼容 OpenAI 协议的中转/代理地址)
    # 注意: Spring AI 2.x 基于 openai-java SDK 直接在此地址后拼接 /chat/completions 等路径 必须包含 /v1
    base-url: http://192.168.100.1:1234/v1
    # API Key
    api-key: kusunoki-tomori
    chat:
      temperature: 0.7
      model: qwen3.5-2b
    embedding:
      model: text-embedding-nomic-embed-text-v1.5


